<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 PS.Chat Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0010; --panel: #0f0018; --border: #6b00c8; --glow: #a855f7;
    --text: #d8b4fe; --accent: #c084fc; --red: #f87171; --dim: #7c3aed88;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: var(--panel); border:1px solid var(--border);
    padding: 2rem; width: 360px; max-width: 90vw;
    box-shadow: 0 0 20px #6b00c840;
  }
  .logo {
    font-family: 'Orbitron', monospace; font-weight:900; font-size:1.1rem;
    color: var(--accent); text-shadow: 0 0 8px var(--glow);
    text-align:center; margin-bottom:1.5rem; letter-spacing:2px;
  }
  .logo span { color: var(--glow); }
  label {
    display:block; font-size:0.7rem; color: var(--dim); margin-bottom:4px; letter-spacing:1px;
  }
  input[type="password"] {
    width:100%; padding:8px; background: var(--bg); border:1px solid var(--border);
    color: var(--text); font-family: inherit; font-size:0.8rem; outline:none;
    caret-color: var(--glow); margin-bottom:1rem;
  }
  input:focus { border-color: var(--glow); box-shadow:0 0 6px var(--glow); }
  .btn {
    width:100%; padding:8px; border:1px solid var(--glow); background:transparent;
    color: var(--accent); font-family: inherit; font-size:0.8rem; cursor:pointer;
    letter-spacing:2px; transition:0.2s;
  }
  .btn:hover { background:#6b00c820; box-shadow:0 0 12px var(--glow); }
  .erro { color: var(--red); font-size:0.7rem; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🔐 PS.<span>CHAT ADMIN</span></div>
  <form method="POST">
    <label for="senha">SENHA</label>
    <input type="password" id="senha" name="senha" autofocus>
    <button type="submit" class="btn">AUTENTICAR</button>
  </form>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
</div>
</body>
</html>
