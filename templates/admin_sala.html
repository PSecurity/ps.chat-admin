<script>
  async function acao(acao, username) {
    if (!confirm(`Confirmar ${acao.toUpperCase()} de ${username}?`)) return;
    const formData = new URLSearchParams();
    formData.append('acao', acao);
    formData.append('username', username);
    try {
      const resp = await fetch('/admin/sala/{{ token }}/acao', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: formData
      });
      if (!resp.ok) {
        const err = await resp.json();
        alert(err.mensagem || 'Erro desconhecido.');
        return;
      }
      location.reload();
    } catch(e) {
      alert('Falha na comunicação com o servidor.');
    }
  }
</script>
