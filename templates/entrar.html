<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS.Chat — Entrar na sala</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0010;
            color: #d8b4fe;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #0f0018;
            border: 1px solid #6b00c8;
            padding: 40px 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 30px #7c3aed40;
            text-align: center;
        }
        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            color: #c084fc;
            text-shadow: 0 0 10px #a855f7;
            margin-bottom: 20px;
        }
        .glow-text {
            color: #7c3aed;
            margin-bottom: 25px;
            font-size: 0.8rem;
        }
        input {
            width: 100%;
            background: #0a0015;
            border: 1px solid #6b00c8;
            color: #e9d5ff;
            padding: 12px;
            font-family: monospace;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 12px #a855f7;
        }
        button {
            background: transparent;
            border: 1px solid #c084fc;
            color: #c084fc;
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        button:hover {
            background: #6b00c820;
            box-shadow: 0 0 15px #c084fc;
        }
        footer {
            margin-top: 25px;
            font-size: 0.6rem;
            color: #6b00c870;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 PS.CHAT</h1>
    <div class="glow-text">> INFORME O TOKEN DA SALA</div>
    <form method="post" action="/entrar">
        <input type="text" name="token" placeholder="ex: a1b2c3d4" autocomplete="off" required>
        <button type="submit">⏎ CONECTAR</button>
    </form>
    <footer>PSECURITY // OFFLINE CHAT</footer>
</div>
</body>
</html>
