<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>PS.Chat — {{ nome_sala }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0010;
            color: #d8b4fe;
            font-family: 'Share Tech Mono', monospace;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(168,85,247,0.08) 2px, rgba(168,85,247,0.08) 4px);
            pointer-events: none;
            z-index: 9999;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #6b00c8;
            background: #0f0018;
            flex-shrink: 0;
        }
        .logo {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            color: #c084fc;
            text-shadow: 0 0 12px #a855f7;
            font-size: 0.9rem;
        }
        .token-badge {
            font-size: 0.65rem;
            border: 1px solid #9b30ff;
            padding: 4px 10px;
            background: #6b00c815;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px;
            gap: 12px;
            min-height: 0;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            background: #0a0015;
            border: 1px solid #6b00c830;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .message {
            font-size: 0.85rem;
            line-height: 1.4;
            border-left: 3px solid #9b30ff;
            padding-left: 10px;
            word-break: break-word;
        }
        .message .user { color: #c084fc; font-weight: bold; }
        .message .timestamp { font-size: 0.6rem; color: #7c3aed; margin-left: 10px; }
        .system-msg { color: #6b00c8; font-style: italic; font-size: 0.75rem; text-align: center; border-left: none; }
        .input-area {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #0f0018;
            padding: 10px 12px;
            border-top: 1px solid #6b00c8;
            flex-shrink: 0;
        }
        #username, #messageInput {
            background: #0a0015;
            border: 1px solid #6b00c8;
            color: #e9d5ff;
            padding: 10px;
            font-family: monospace;
            outline: none;
        }
        #username { width: 110px; font-size: 0.8rem; }
        #messageInput { flex: 1; font-size: 0.9rem; }
        button {
            background: transparent;
            border: 1px solid #9b30ff;
            color: #d8b4fe;
            padding: 8px 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { border-color: #c084fc; box-shadow: 0 0 12px #7c3aed40; }
        .statusbar {
            font-size: 0.6rem;
            padding: 5px 12px;
            background: #0f0018;
            border-top: 1px solid #6b00c830;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #9b30ff; }
        @media (max-width: 768px) {
            .input-area { padding: 8px 10px; }
            #username { width: 80px; padding: 8px; }
            button { padding: 8px 12px; }
        }
    </style>
</head>
<body>
<header>
    <div class="logo">👾 PS.<span>CHAT</span> — {{ nome_sala }}</div>
    <div class="token-badge">🔑 TOKEN: {{ token }}</div>
</header>

<div class="chat-container">
    <div class="messages-area" id="messages"></div>
    <div class="input-area">
        <input type="text" id="username" placeholder="NOME" autocomplete="off" value="Anônimo">
        <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off">
        <button id="sendBtn">➤ ENVIAR</button>
    </div>
</div>
<div class="statusbar">
    <span>🔓 Modo: texto plano (teste)</span>
    <span id="connStatus">🟡 CONECTANDO...</span>
</div>

<script>
    const token = "{{ token }}";
    console.log("🔑 Token da sala:", token);
    
    const socket = io({
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000
    });
    
    let username = '';
    
    const messagesDiv = document.getElementById('messages');
    const usernameInput = document.getElementById('username');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const connStatus = document.getElementById('connStatus');

    function scrollToBottom() {
        messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: 'smooth' });
    }

    function exibirMensagem(user, text, timestamp, isSystem = false) {
        const time = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
        const msgDiv = document.createElement('div');
        if (isSystem || user === '🔵 Sistema' || user === '⚫ Sistema') {
            msgDiv.className = 'message system-msg';
            msgDiv.innerHTML = `<span>${escapeHtml(user)}: ${escapeHtml(text)}</span>`;
        } else {
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span class="user">${escapeHtml(user)}</span><span class="timestamp">${time}</span><br>${escapeHtml(text)}`;
        }
        messagesDiv.appendChild(msgDiv);
        scrollToBottom();
    }

    // ---------- SOCKET EVENTS ----------
    socket.on('connect', () => {
        console.log("✅ Conectado ao servidor WebSocket");
        connStatus.innerHTML = '🟢 CONECTADO';
        connStatus.style.color = '#4ade80';
        username = usernameInput.value.trim() || "Anônimo";
        socket.emit('entrar', { token: token, username: username });
        console.log("📡 Evento 'entrar' enviado:", { token, username });
    });

    socket.on('connect_error', (error) => {
        console.error("❌ Erro de conexão:", error);
        connStatus.innerHTML = '🔴 ERRO DE CONEXÃO';
        connStatus.style.color = '#f87171';
    });

    socket.on('disconnect', () => {
        console.log("⚠️ Desconectado do servidor");
        connStatus.innerHTML = '🔴 DESCONECTADO';
        connStatus.style.color = '#f87171';
    });

    // Recebe histórico de mensagens
    socket.on('historico', (historico) => {
        console.log("📜 Histórico recebido:", historico.length, "mensagens");
        for (const msg of historico) {
            const texto = msg.text || (msg.ciphertext ? "[Mensagem criptografada]" : "");
            exibirMensagem(msg.user, texto, msg.timestamp, false);
        }
    });

    // Recebe mensagem em tempo real
    socket.on('message', (data) => {
        console.log("💬 Mensagem recebida:", data);
        let texto = data.text;
        if (!texto && data.ciphertext) {
            texto = "[Mensagem criptografada - sem chave]";
        }
        exibirMensagem(data.user, texto, data.timestamp, false);
    });

    socket.on('sala_fechada', (data) => {
        console.log("🚪 Sala fechada pelo admin");
        exibirMensagem('⚠️ Sistema', data.msg, '', true);
        messageInput.disabled = true;
        sendBtn.disabled = true;
    });

    // ---------- ENVIO DE MENSAGEM ----------
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) {
            console.log("⚠️ Mensagem vazia, não enviada");
            return;
        }
        
        let user = usernameInput.value.trim();
        if (!user) user = "Anônimo";
        
        if (username !== user) {
            username = user;
            socket.emit('entrar', { token: token, username: username });
        }
        
        const messageData = {
            token: token,
            username: username,
            text: text,
            timestamp: new Date().toISOString()
        };
        
        console.log("📤 Enviando mensagem:", messageData);
        socket.emit('mensagem', messageData);
        
        // Limpa o input
        messageInput.value = '';
        messageInput.focus();
        
        // Pequeno delay para garantir rolagem
        setTimeout(scrollToBottom, 100);
    }

    // Eventos de UI
    sendBtn.onclick = () => {
        console.log("🔘 Botão Enviar clicado");
        sendMessage();
    };
    
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            console.log("⏎ Tecla Enter pressionada");
            e.preventDefault();
            sendMessage();
        }
    });
    
    messageInput.addEventListener('focus', () => setTimeout(scrollToBottom, 200));
    
    usernameInput.addEventListener('change', () => {
        let newName = usernameInput.value.trim();
        if (newName && newName !== username) {
            username = newName;
            socket.emit('entrar', { token: token, username: username });
            console.log("📛 Nome alterado para:", username);
        }
    });

    // Ao fechar a página, avisa que saiu
    window.addEventListener('beforeunload', () => {
        if (username) {
            socket.emit('sair', { token: token, username: username });
        }
    });

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Inicializa
    window.onload = () => {
        console.log("🚀 Página carregada, sala:", token);
        scrollToBottom();
    };
</script>
</body>
</html>
